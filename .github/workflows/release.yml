name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install httpx pytest
      - run: pytest tests/

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pyproject.toml version matches tag
        run: |
          import tomllib, sys
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = "${{ github.ref_name }}".lstrip("v")
          if version != tag:
              print(f"ERROR: pyproject.toml version ({version}) does not match tag ({tag})")
              sys.exit(1)
          print(f"Version matches: {version}")
        shell: python

      - run: pip install build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
